



services:




  DNS:
    image: coredns/coredns:latest
    volumes:
      - ./dns/:/etc/coredns/:ro
    command: -conf /etc/coredns/Corefile
    working_dir: /etc/coredns/

    networks:
      rede-do-balacobaco:
        ipv4_address: 172.20.0.100






  proxy-rev:
    image: nginx:latest
    working_dir: /var/www/html/
    ports:
      - "8080:90"
  
    volumes:
      - ./rev-proxy/:/etc/nginx/templates/:ro
      - ./rev-proxy/logs/:/etc/nginx/logs:rw
      - ./rev-proxy/static/:/var/www/html/:ro
    command: ["nginx", '-g', 'daemon off;']
    depends_on:
      - DNS
      - app1
      - app2

    dns:
      - 172.20.0.100
    networks:
      rede-do-balacobaco:
        ipv4_address: 172.20.0.30









  app1:
    image: nginx:latest
    ports:
      - "8081:90"

    volumes: 
      - ./app1/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./app1/logs/:/etc/nginx/logs:rw
      - ./app1/static/:/var/www/html/:ro
    command: ["nginx", '-g', 'daemon off;']

    networks:
      rede-do-balacobaco:
        ipv4_address: 172.20.0.10
  






  app2:
    image: nginx:latest
    ports:
      - "8082:90"

    volumes: 
      - ./app2/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./app2/logs/:/etc/nginx/logs:rw
      - ./app2/static/:/var/www/html/:ro
    command: ["nginx", '-g', 'daemon off;']

    networks:
      rede-do-balacobaco:
        ipv4_address: 172.20.0.20

  


networks:
  rede-do-balacobaco:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
        