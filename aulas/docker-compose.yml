



services:




  dnsmasq:
    image: jpillora/dnsmasq:latest
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/hosts:/etc/dnsmasq.d/dinamic-hosts:rw
      - ./dnsmasq/order.sh:/etc/dnsmasq.d/order.sh:ro
      - ./dnsmasq/resolv.conf:/etc/resolv.conf:rw
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      rede-do-balacobaco:
        ipv4_address: 172.20.0.100






  proxy-rev:
    hostname: proxy-reverso-super-fodastico
    image: ubuntu/nginx:latest
    working_dir: /var/www/html/
    ports:
      - "8080:90"
  
    volumes:
      - ./rev-proxy/:/etc/nginx/templates/:ro
      - ./rev-proxy/logs/:/etc/nginx/logs:rw
      - ./rev-proxy/static/:/var/www/html/:ro
      - ./rev-proxy/esperar-dns.sh:/docker-entrypoint.d/esperar-dns.sh:ro
    command: ["nginx", "-g", "daemon off;"]

    depends_on:
      - dnsmasq
      - app1
      - app2

    dns:
      - 172.20.0.100
    networks:
      rede-do-balacobaco:









  app1:
    hostname: app-super-fodastico-1
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8081:90"

    volumes: 
      - ./app1/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./app1/logs/:/etc/nginx/logs:rw
      - ./app1/static/:/var/www/html/:ro
    command: ["nginx", '-g', 'daemon off;']

    depends_on:
      - dnsmasq
    cap_add:
      - NET_ADMIN
    networks:
      rede-do-balacobaco:
  






  app2:
    hostname: app-super-fodastico-2
    build:
      context: .
      dockerfile: dockerfile-app-setup
    ports:
      - "8082:90"

    volumes: 
      - ./app2/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./app2/logs/:/etc/nginx/logs:rw
      - ./app2/static/:/var/www/html/:ro
    command: ["nginx", '-g', 'daemon off;']
    depends_on:
      - dnsmasq
    cap_add:
      - NET_ADMIN
    networks:
      rede-do-balacobaco:

  


networks:
  rede-do-balacobaco:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
        