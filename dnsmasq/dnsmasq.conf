



domain=DomainExpansion.com
local=/DomainExpansion.com/
auth-zone=DomainExpansion.com


auth-server=ns1.DomainExpansion.com
host-record=ns1.DomainExpansion.com,172.20.0.100

expand-hosts
addn-hosts=/etc/dnsmasq.d/dinamic_hosts
dhcp-script=/etc/dnsmasq.d/order.sh


cache-size=1000

interface=eth0
server=8.8.8.8
server=1.1.1.1
dhcp-range=172.20.0.110,172.20.0.150,255.255.0.0,12h
dhcp-option=option:router,172.20.0.1
dhcp-option=option:dns-server,172.20.0.100
